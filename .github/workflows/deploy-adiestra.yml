name: Publicar Cuaderno de campo

# Compila la app de experimentos/adiestra y la publica en GitHub Pages, que es
# lo que permite instalarla en el móvil (hace falta HTTPS).
# Requisito: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "experimentos/adiestra/**"
      - ".github/workflows/deploy-adiestra.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimentos/adiestra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experimentos/adiestra/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: experimentos/adiestra/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
